[project]
name = "tj-agent"
version = "0.1.0"
description = "TJ Agent - A ReAct-based autonomous AI agent system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "uvicorn>=0.27.0",
    "loguru>=0.7.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "questionary>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
tj-cli = "tj_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
